services:
  # --------------------------------------------------------------------------
  # 1. Primary Relational Database: PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pulselink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulselink_user
      POSTGRES_PASSWORD: pulselink_password
      POSTGRES_DB: pulselink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselink_user -d pulselink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. In-Memory Cache & Message Broker: Redis 7
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pulselink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: